<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heisenball</title>
    <style type="text/css">
        * {
            --primary: rgb(61, 100, 19);
            --secondary: rgb(198, 187, 27);
            --primaryFont: rgb(0, 0, 0);
            --secondaryFont: rgb(106, 42, 139);
            --radius: 15px;
            --spacing: 2%;

            font-family: 'Verdana', sans-serif;
            box-sizing: border-box;
            scroll-snap-type: x mandatory;
            margin: 0; padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100dvw; height: 100dvh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            margin: 0; padding: var(--spacing);
        }

        section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%; height: 100%;
            margin: 0; padding: 0; gap: var(--spacing);
            border: 3px solid white;
            border-radius: var(--radius);
            overflow-x: scroll;
            -ms-overflow-style: none;
            scrollbar-width: none;
            box-sizing: border-box;
        }

        header {
            display: flex;
            text-align: center;
            align-items: center;
            font-size: 300%;
            margin: var(--spacing);
            height: 20%;
            box-sizing: border-box;
        }

        .menu {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 60%;
            border-top: 5px solid var(--secondary);
            border-bottom: 5px solid var(--secondary);
            box-sizing: border-box;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 150%;
            align-items: center;
            height: auto;
            flex-grow: 1;
            padding: var(--spacing);
            margin: var(--spacing);
            border: 3px solid white;
            border-radius: var(--radius);
            overflow-y: scroll;
            box-sizing: border-box;
        }

        input[type = "radio"]{
            opacity: 0;
            position: fixed;
            width: 0;    
        }

        input[type = "radio"]:label{
            display: inline-block;
            background-color: white;
            padding: 10px 20px;
            border-width: 5px;
            border-radius: 4px;
        }

        input[type = "radio"]:checked + label{
            background-color: yellow; 
            border-color: black;
        }

        .description {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 150%;
            height: auto;
            flex-grow: 1;
            margin: var(--spacing);
            border: 3px solid white;
            border-radius: var(--radius);
            box-sizing: border-box;
        }

        .button {
            display: flex;
            align-items: center;
            width: 80%; height: 10%;
            font-size: 200%;
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            padding: var(--spacing);
            margin: var(--spacing);
            background-color: var(--secondary);
            box-sizing: border-box;
        }

        #data {
            display: grid;
            position: absolute;
            width: 80%;
            grid-template-columns: 1fr 1fr;
        }
        #data > * {
            display: flex;
            border: 2px solid black;
            flex-grow: 1;
            text-align: center;
            justify-content: center;
            align-items: center;
            font-size: 200%;
            padding: var(--spacing);
            background-color: var(--secondary);
        }

        #continue {
            display: none;
            position: absolute;
            bottom: 5%;
        }

        canvas {
            display: none;
            position: absolute;
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>
    <section>
        <!-- Awesome Header -->
        <header>Heisenball</header>

        <!-- Selection Menu -->
        <div class="menu">
            <form id="trialSelect">
                <input type="radio" id="trialA" name="trial" value="a" checked>
                <label for="trialA">Trial A</label><br>
                <input type="radio" id="trialB1" name="trial" value="b1">
                <label for="trialB1">Trial B1</label><br>
                <input type="radio" id="trialB2" name="trial" value="b2">
                <label for="trialB2">Trial B2</label><br>
                <input type="radio" id="trialC1" name="trial" value="c1">
                <label for="trialC1">Trial C1</label><br>
                <input type="radio" id="trialC2" name="trial" value="c2">
                <label for="trialC2">Trial C2</label><br>
                <input type="radio" id="trialD" name="trial" value="d">
                <label for="trialD">Trial D</label><br>
                <input type="radio" id="trialE" name="trial" value="e">
                <label for="trialE">Trial E</label><br>
                <input type="radio" id="trialF" name="trial" value="f">
                <label for="trialF">Trial F</label><br>
                <input type="radio" id="trialG" name="trial" value="g">
                <label for="trialG">Trial G</label><br>
            </form>
            <div class="description">
                <p>
                    Welcome to Heisenball!<br>
                    <- Select a lab trial on the left<br>
                    Select a character on the right -><br>
                    Press "SIMULATE" below to begin<br><br>
                    (WASD to Move, Spacebar to throw)
                </p>
            </div>
            <form id="characterSelect">
                <input type="radio" id="walter" name="character" value="walter" checked>
                <label for="walter">Walter</label><br>
                <input type="radio" id="jesse" name="character" value="jesse">
                <label for="jesse">Jesse</label><br>
                <input type="radio" id="skyler" name="character" value="skyler">
                <label for="skyler">Skyler</label><br>
                <input type="radio" id="flynn" name="character" value="flynn">
                <label for="flynn">Flynn</label><br>
                <input type="radio" id="hank" name="character" value="hank">
                <label for="hank">Hank</label><br>
                <input type="radio" id="marie" name="character" value="marie">
                <label for="marie">Marie</label><br>
                <input type="radio" id="saul" name="character" value="saul">
                <label for="saul">Saul</label><br>
                <input type="radio" id="gustavo" name="character" value="gustavo">
                <label for="gustavo">Gustavo</label><br>
                <input type="radio" id="mike" name="character" value="mike">
                <label for="mike">Mike</label><br>
                <input type="radio" id="badger" name="character" value="badger">
                <label for="badger">Badger</label><br>
                <input type="radio" id="pete" name="character" value="pete">
                <label for="pete">Pete</label><br>
                <input type="radio" id="combo" name="character" value="combo">
                <label for="combo">Combo</label><br>
                <input type="radio" id="jane" name="character" value="jane">
                <label for="jane">Jane</label><br>
                <input type="radio" id="steve" name="character" value="steve">
                <label for="steve">Steve</label><br>
                <input type="radio" id="marco" name="character" value="marco">
                <label for="marco">Marco</label><br>
                <input type="radio" id="leonel" name="character" value="leonel">
                <label for="leonel">Leonel</label><br>
                <input type="radio" id="hector" name="character" value="hector">
                <label for="hector">Hector</label><br>
                <input type="radio" id="tuco" name="character" value="tuco">
                <label for="tuco">Tuco</label><br>
                <input type="radio" id="ted" name="character" value="ted">
                <label for="ted">Ted</label><br>
                <input type="radio" id="cristal" name="character" value="cristal">
                <label for="cristal">Cristal</label><br>
            </form>
        </div>

        <!-- Simulate Button -->
         <div id="simulate" class="button">SIMULATE</div>

        <!-- Simulation Window -->
        <canvas id="canvas"></canvas>

        <!-- Results data grid -->
        <div id="data"></div>

        <!-- Continue button -->
        <div id="continue" class="button">Continue</div>
    </section>
    <script type="text/javascript">

        let canvas; let ctx;
        let trials; let characters;
        let player; let players; let snowballs;
        let sprites; let timer; let input = {};

        // Parameters
        const spriteWidth = 40; const spriteHeight = 80;
        const playerSpeed = 1; const snowballSpeed = 2;
        const duration = 10; const iterations = 5;

        function init() {
            canvas = document.getElementById("canvas");
            canvas.width = document.body.clientWidth;
            canvas.height = document.body.clientHeight;
            canvas.getContext("2d", { willReadFrequently: true })
            ctx = canvas.getContext("2d");

            trials = { // Left snowballs, Left people %, Right snowballs, Right peole %
                a: [54, 50, 0, 50], b1: [54, 70, 0, 30], b2: [54, 90, 0, 10],
                c1: [54, 30, 0, 70], c2: [54, 10, 0, 90], d: [44, 40, 0, 60],
                e: [44, 40, 10, 60], f: [34, 40, 10, 60], g: [44, 40, 0, 60]
            }

            characters = { // X, Y, Width, Height
                walter: [10, 7, 60, 175], jesse: [78, 7, 58, 175], skyler: [142, 5, 65, 175],
                flynn: [210, 20, 65, 160], hank: [278, 7, 70, 175], marie: [355, 5, 64, 175],
                saul: [425, 5, 65, 177], gustavo: [0, 200, 57, 170], mike: [65, 200, 65, 170],
                badger: [135, 195, 65, 175], pete: [205, 190, 60, 180], combo: [270, 196, 90, 175],
                jane: [365, 195, 65, 175], steve: [435, 195, 65, 175], marco: [0, 380, 70, 190],
                leonel: [76, 380, 70, 190], hector: [150, 403, 82, 190], tuco: [235, 390, 65, 190],
                ted: [307, 400, 65, 170], cristal: [377, 380, 65, 190]
            }

            sprites = new Image();
            sprites.src = "https://64.media.tumblr.com/0a246df9d7321ae8b7a7618b0bcda8e3/tumblr_mhtnb19bVw1qzpxx1o1_500.jpg";
            timer = 0;
            document.getElementById("simulate").addEventListener("click", (event) => {
                trialData = Object.fromEntries(new FormData(document.getElementById("trialSelect")));
                characterData = Object.fromEntries(new FormData(document.getElementById("characterSelect")));
                const trial = trialData.trial; const character = characterData.character;
                if (!trial || !character) { return; }
                Simulate(trial, character);
            });
        }

        function Simulate(trial, character) {
            timer = duration + 1;
            canvas.style.display = "inline";
            player = {x: spriteWidth, y: canvas.height - (canvas.height * 2/3), character, side: 0};
            players = []; let sides = [1, 0]; // Left and Right side counts
            for (let index = 1; index < Object.keys(characters).length; index++) {
                let side = Math.round(Math.random());
                if (sides[side] >= Object.keys(characters).length * (trials[trial][side * 2 + 1] / 100)) { side = Math.abs(side - 1); }
                sides[side] += 1;
                const xCoord = (canvas.width - spriteWidth * 2) * side + spriteWidth;
                const yCoord = Math.floor((canvas.height - canvas.height * 2/3) + (canvas.height * 2/3) / 20 * index);
                const person = {x: xCoord, y: yCoord, character: characters[Object.keys(characters)[index]], side, claim: null};
                players.push(person);
            }
            snowballs = [];
            for (let index = 0; index < trials[trial][0]; index++) { // Left side snowballs
                const xCoord = Math.floor(Math.random() * (canvas.width / 2));
                const yCoord = Math.floor(Math.random() * (canvas.height - (canvas.height * 1/3 + spriteHeight / 2)) + (canvas.height * 1/3 + spriteHeight / 2));
                snowball = {x: xCoord, y: yCoord, dX: xCoord, dY: yCoord, side: 0, claim: null};
                snowballs.push(snowball);
            }
            for (let index = 0; index < trials[trial][2]; index++) { // Right side snowballs
                const xCoord = Math.floor(Math.random() * (canvas.width - (canvas.width / 2)) + (canvas.width / 2));
                const yCoord = Math.floor(Math.random() * (canvas.height - (canvas.height * 1/3)) + (canvas.height * 1/3));
                snowball = {x: xCoord, y: yCoord, dX: xCoord, dY: yCoord, side: 1, claim: null};
                snowballs.push(snowball);
            }
            
            let data = [];
            function Countdown(iteration) {
                if (timer >= 0) { // Still running
                    timer -= 1;
                    setTimeout(Countdown, 1000, iteration);
                }
                else {
                    console.log("Iteration", iteration, "done");
                    let leftCount = 0; let rightCount = 0;
                    for (const snowball of snowballs) {
                        if (snowball.side == 0) { leftCount++; }
                        else if (snowball.side == 1) { rightCount++; }
                    }
                    data.push([leftCount, rightCount]);
                    if (iteration >= iterations) {
                        const grid = document.getElementById("data");
                        const leftHeader = document.createElement("p");
                        const rightHeader = document.createElement("p");
                        leftHeader.textContent = "# of A"; rightHeader.textContent = "# of B";
                        grid.appendChild(leftHeader); grid.appendChild(rightHeader);
                        for (const collection of data) {
                            const left = document.createElement("p");
                            const right = document.createElement("p");
                            left.textContent = collection[0];
                            right.textContent = collection[1];
                            grid.appendChild(left); grid.appendChild(right);
                        }
                    }
                    const cont = document.getElementById("continue");
                    cont.style.display = "flex";
                    cont.onclick = (event) => {
                        if (iteration < iterations) { // More iterations to go
                            cont.style.display = "none";
                            timer = duration + 1;
                            Countdown(iteration + 1);
                            Render()
                        }
                        else { // Trial completed
                            cont.style.display = "none";
                            canvas.style.display = "none";
                            document.getElementById("data").replaceChildren();
                        }
                    }
                }
            }

            Countdown(1); Render();
        }

        function Render(timestamp) { // Draw everything in the simulation and runs update loop
            if (timer < 0) { // Allow for data download and exit
                // Tally side totals
                let leftCount = 0; let rightCount = 0;
                for (const snowball of snowballs) {
                    if (snowball.side == 0) { leftCount++; }
                    else if (snowball.side == 1) { rightCount++; }
                }
                ctx.font = "100px arial"; ctx.textAlign = "center";
                ctx.fillStyle = "rgb(255, 255, 255)"; ctx.strokeStyle = "rgb(0, 0, 0)";
                ctx.strokeText(`${leftCount} of A`, canvas.width * 1/4, canvas.height * 1/3 / 2);
                ctx.fillText(`${leftCount} of A`, canvas.width * 1/4, canvas.height * 1/3 / 2);
                ctx.strokeText(`${rightCount} of B`, canvas.width * 3/4, canvas.height * 1/3 / 2);
                ctx.fillText(`${rightCount} of B`, canvas.width * 3/4, canvas.height * 1/3 / 2);
                return;
            }

            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgb(0, 200, 255)";
            ctx.beginPath(); ctx.rect(0, 0, canvas.width, canvas.height); ctx.fill();

            // Snow boudaries
            const snow = [canvas.width, canvas.height * 2/3] // Width, Height
            ctx.fillStyle = "rgb(255, 255, 255)";
            ctx.beginPath(); ctx.rect(0, canvas.height - snow[1], snow[0], snow[1]); ctx.fill();
            ctx.strokeStyle = "rgba(0, 0, 0, 1)";
            ctx.lineWidth = 10; ctx.setLineDash([10]);
            ctx.beginPath(); ctx.moveTo(canvas.width / 2, canvas.height - snow[1]);
            ctx.lineTo(canvas.width / 2, canvas.height); ctx.stroke(); ctx.setLineDash([]);

            // Move player
            if (input.KeyW) { player.y -= 1; } if (input.KeyA) { player.x -= 1; }
            if (input.KeyS) { player.y += 1; } if (input.KeyD) { player.x += 1; }
            if (player.x - spriteWidth / 2 < 0) { player.x = spriteWidth / 2; }
            else if (player.x + spriteWidth / 2 > canvas.width / 2) { player.x = canvas.width / 2 - spriteWidth / 2; }
            if (player.y - spriteHeight / 2 < canvas.height - snow[1]) { player.y = canvas.height - snow[1] + spriteHeight / 2; }
            else if (player.y + spriteHeight / 2 > canvas.height) { player.y = canvas.height - spriteHeight / 2; }
            if (input.Space) { // Attempt to throw a snowball
                for (const snowball of snowballs) {
                    const xCondition = snowball.x <= player.x + spriteWidth / 2 && snowball.x >= player.x - spriteWidth / 2;
                    const yCondition = snowball.y <= player.y + spriteHeight / 2 && snowball.y >= player.y - spriteHeight / 2;
                    if (xCondition && yCondition && snowball.claim != player) {
                        if (snowball.claim != null) { snowball.claim.claim = null; }
                        snowball.claim = player;
                        snowball.dX = Math.floor(Math.random() * (canvas.width - (canvas.width / 2)) + (canvas.width / 2));
                        snowball.dY = Math.floor(Math.random() * (canvas.height - (canvas.height * 1/3 + spriteHeight / 2)) + (canvas.height * 1/3 + spriteHeight / 2));
                        snowball.side = Math.abs(player.side - 1);
                    }
                }
            }

            // Draw other players
            for (const person of players) {
                const character = person.character;
                ctx.drawImage(
                    sprites, character[0], character[1], character[2], character[3],
                    person.x - spriteWidth/2, person.y - spriteHeight/2, spriteWidth, spriteHeight
                );
                if (person.claim == null) { // Find a snowball
                    for (const snowball of snowballs) {
                        if (snowball.claim == null && snowball.side == person.side) {
                            person.claim = snowball;
                            snowball.claim = person;
                            break;
                        }
                    }
                }
                else { // Already found a snowball
                    if (person.x < person.claim.x) { person.x += playerSpeed; }
                    else if (person.x > person.claim.x) { person.x -= playerSpeed; }
                    if (person.y < person.claim.y) { person.y += playerSpeed; }
                    else if (person.y > person.claim.y) { person.y -= playerSpeed; }
                    if (person.x == person.claim.x && person.y == person.claim.y) { // Grabbed the snowball
                        if (person.side == 0) { // Throw to right
                            person.claim.dX = Math.floor(Math.random() * (canvas.width - (canvas.width / 2)) + (canvas.width / 2));
                            person.claim.dY = Math.floor(Math.random() * (canvas.height - (canvas.height * 1/3 + spriteHeight / 2)) + (canvas.height * 1/3 + spriteHeight / 2));
                        }
                        else { // Throw to left
                            person.claim.dX = Math.floor(Math.random() * (canvas.width / 2));
                            person.claim.dY = Math.floor(Math.random() * (canvas.height - (canvas.height * 1/3 + spriteHeight / 2)) + (canvas.height * 1/3 + spriteHeight / 2));
                        }
                        person.claim.side = Math.abs(person.claim.side - 1);
                        person.claim = null;
                    }
                }
            }

            // Draw player
            const character = characters[player.character];
            ctx.drawImage(
                sprites, character[0], character[1], character[2], character[3],
                player.x - spriteWidth/2, player.y - spriteHeight/2, spriteWidth, spriteHeight
            );

            // Draw snowballs
            for (const snowball of snowballs) {
                ctx.fillStyle = "rgb(220, 220, 220)";
                ctx.beginPath(); ctx.arc(snowball.x, snowball.y, 10, 0, 2 * Math.PI);
                ctx.strokeStyle = "rgb(0, 0, 0)"; ctx.stroke(); ctx.fill();
                if (snowball.claim != null && snowball.claim.side != snowball.side) {
                    if (snowball.x < snowball.dX - snowballSpeed) { snowball.x += snowballSpeed; }
                    else if (snowball.x > snowball.dX + snowballSpeed) { snowball.x -= snowballSpeed; }
                    if (snowball.y < snowball.dY - snowballSpeed) { snowball.y += snowballSpeed; }
                    else if (snowball.y > snowball.dY + snowballSpeed) { snowball.y -= snowballSpeed; }
                    if (snowball.x <= snowball.dX + snowballSpeed && snowball.x >= snowball.dX - snowballSpeed) { // Landed on other side
                        if (snowball.y <= snowball.dY + snowballSpeed && snowball.y >= snowball.dY - snowballSpeed) {
                            snowball.claim = null;
                        }
                    }
                }
            }

            // Draw timer
            ctx.font = "100px arial";
            ctx.fillStyle = "rgb(255, 255, 255)";
            ctx.strokeStyle = "rgb(0, 0, 0)";
            ctx.textAlign = "center";
            ctx.strokeText(timer, canvas.width / 2, canvas.height * 1/3 / 2);
            ctx.fillText(timer, canvas.width / 2, canvas.height * 1/3 / 2);

            window.requestAnimationFrame(Render);
        }

        window.onkeydown = (event) => { input[event.code] = true; }
        window.onkeyup = (event) => { input[event.code] = false; }
        window.onload = init;
    </script>
</body>
</html>
